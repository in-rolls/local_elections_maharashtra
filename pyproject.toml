[project]
name = "local-elections-maharashtra"
version = "0.1.0"
description = "Maharashtra gram panchayat sarpanch elections, 2017-2023: seat reservations, candidates and results from the State Election Commission"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Priyadarshi Amar" }]
license = "MIT"
license-files = ["LICENSE"]
keywords = ["Maharashtra", "elections", "panchayats", "sarpanch", "reservation", "data"]
dependencies = [
    "lxml>=5.0",
    "openpyxl>=3.1.5",
    "pandas>=2.3",
    "pyarrow>=21",
    "xlrd>=2.0",
]

[project.urls]
Repository = "https://github.com/in-rolls/local_elections_maharashtra"
Issues = "https://github.com/in-rolls/local_elections_maharashtra/issues"

[dependency-groups]
dev = ["ruff>=0.14", "pytest>=8"]

[tool.ruff]
line-length = 130
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP"]
# long tabular strings and dict(...) calls are kept for readability
ignore = ["E501", "C408"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/local_elections_maharashtra"]
